name: Release MacVigil

on:
  push:
    branches:
      - main
    paths:
      - RELEASE_VERSION
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint MacVigil/Info.plist

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -f RELEASE_VERSION ]]; then
            VERSION="$(tr -d '[:space:]' < RELEASE_VERSION)"
          else
            VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' MacVigil/Info.plist)
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            PLIST_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' MacVigil/Info.plist)
            test "$VERSION" = "$PLIST_VERSION"
          fi

          NOTES_FILE="release-notes/v${VERSION}.md"
          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "Curated release notes are required: $NOTES_FILE" >&2
            echo "Create the release notes before changing RELEASE_VERSION." >&2
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"
          echo "Curated release notes confirmed: $NOTES_FILE"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" MacVigil/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" MacVigil/Info.plist
          echo "Release metadata confirmed: v$VERSION"

      - name: Synchronize changelog from release notes
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          changelog_path = Path("CHANGELOG.md")
          notes_dir = Path("release-notes")

          if not changelog_path.exists():
              raise SystemExit("CHANGELOG.md is missing")
          if not notes_dir.is_dir():
              raise SystemExit("release-notes/ is missing")

          text = changelog_path.read_text(encoding="utf-8")

          def version_tuple(value: str):
              return tuple(int(part) for part in value.split("."))

          def file_commit_date(path: Path) -> str:
              result = subprocess.run(
                  ["git", "log", "-1", "--format=%as", "--", str(path)],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              value = result.stdout.strip()
              if not value:
                  raise SystemExit(f"Could not determine release date for {path}")
              return value

          missing = []
          for notes_path in notes_dir.glob("v*.md"):
              match = re.fullmatch(r"v(\d+\.\d+\.\d+)\.md", notes_path.name)
              if not match:
                  continue

              version = match.group(1)
              if re.search(rf"(?m)^## \[{re.escape(version)}\](?:\s|$)", text):
                  continue

              body = notes_path.read_text(encoding="utf-8").strip()
              lines = body.splitlines()
              if lines and lines[0].startswith("# "):
                  lines = lines[1:]
              body = "\n".join(lines).strip()

              body = re.split(r"(?m)^## Updating\s*$", body, maxsplit=1)[0].rstrip()
              body = re.sub(
                  r"(?m)^(#{2,6})(\s+)",
                  lambda m: "#" + m.group(1) + m.group(2),
                  body,
              )

              date = file_commit_date(notes_path)
              entry = f"## [{version}] - {date}\n\n{body}\n"
              missing.append((version_tuple(version), entry))

          if not missing:
              print("CHANGELOG.md already contains every curated release.")
              raise SystemExit(0)

          missing.sort(key=lambda item: item[0], reverse=True)
          entries = "\n".join(entry.rstrip() for _, entry in missing) + "\n\n"

          first_version = re.search(r"(?m)^## \[", text)
          if first_version:
              insert_at = first_version.start()
              prefix = text[:insert_at].rstrip() + "\n\n"
              suffix = text[insert_at:].lstrip()
              updated = prefix + entries + suffix
          else:
              updated = text.rstrip() + "\n\n" + entries

          changelog_path.write_text(updated.rstrip() + "\n", encoding="utf-8")
          print("Added missing curated releases to CHANGELOG.md:")
          for version, _ in missing:
              print(" -", ".".join(str(part) for part in version))
          PY

          if git diff --quiet -- CHANGELOG.md; then
            echo "RELEASE_TARGET_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
            echo "Changelog already synchronized."
          else
            if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
              echo "Tag-triggered releases require CHANGELOG.md to already be synchronized." >&2
              git diff -- CHANGELOG.md
              exit 1
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "Update changelog for v${VERSION} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            RELEASE_TARGET_SHA="$(git rev-parse HEAD)"
            echo "RELEASE_TARGET_SHA=$RELEASE_TARGET_SHA" >> "$GITHUB_ENV"
            echo "Changelog committed at $RELEASE_TARGET_SHA"
          fi

      - name: Build universal app and CLI
        shell: bash
        run: |
          set -euo pipefail

          APP="build/MacVigil.app"
          MACOS_DIR="$APP/Contents/MacOS"
          HELPERS_DIR="$APP/Contents/Library/Helpers"
          RESOURCES_DIR="$APP/Contents/Resources"
          mkdir -p "$MACOS_DIR" "$HELPERS_DIR" "$RESOURCES_DIR"
          mkdir -p build/arm64/app build/arm64/watchdog build/arm64/cli
          mkdir -p build/x86_64/app build/x86_64/watchdog build/x86_64/cli

          SRC=(
            MacVigil/App/MacVigilApp.swift
            MacVigil/Models/SessionDuration.swift
            MacVigil/Core/ShellRunner.swift
            MacVigil/Core/Power/PowerAssertions.swift
            MacVigil/Core/Power/SystemPowerVeto.swift
            MacVigil/Core/Power/PowerIntelligenceController.swift
            MacVigil/Core/Lid/RootDomainLidGuard.swift
            MacVigil/Core/Display/BacklightController.swift
            MacVigil/Core/Runtime/VigilManager.swift
            MacVigil/Core/Runtime/PreferenceStore.swift
            MacVigil/Core/Runtime/LiveReconfiguration.swift
            MacVigil/Core/Updates/UpdateManager.swift
            MacVigil/Core/Jobs/JobAwareController.swift
            MacVigil/Core/Hotkeys/GlobalHotkeyManager.swift
            MacVigil/Core/CLI/CLIProtocol.swift
            MacVigil/Core/CLI/CLIControlServer.swift
            MacVigil/Core/CLI/CLIInstallManager.swift
            MacVigil/UI/PolishedMenuBarView.swift
            MacVigil/UI/MacVigilRootView.swift
            MacVigil/UI/PowerIntelligenceView.swift
            MacVigil/UI/PowerIntelligenceBar.swift
            MacVigil/UI/InteractionReliabilityView.swift
            MacVigil/UI/JobGuardWindowView.swift
            MacVigil/UI/LiquidGlassMenuView.swift
            MacVigil/UI/MacVigilSettingsView.swift
            MacVigil/UI/SettingsSceneContainer.swift
            MacVigil/UI/StatisticsView.swift
          )

          COMMON=(
            -parse-as-library
            -O
            -framework SwiftUI
            -framework AppKit
            -framework CoreGraphics
            -framework IOKit
            -framework CryptoKit
            -framework UserNotifications
            -framework ServiceManagement
            -framework Carbon
          )

          for ARCH in arm64 x86_64; do
            xcrun --sdk macosx swiftc "${SRC[@]}" "${COMMON[@]}" \
              -target "${ARCH}-apple-macos13.0" \
              -o "build/${ARCH}/app/MacVigil"

            xcrun --sdk macosx swiftc MacVigilWatchdog/Watchdog.swift \
              -parse-as-library -O \
              -framework CoreGraphics -framework IOKit \
              -target "${ARCH}-apple-macos13.0" \
              -o "build/${ARCH}/watchdog/MacVigilWatchdog"

            xcrun --sdk macosx swiftc \
              MacVigil/Core/CLI/CLIProtocol.swift \
              MacVigilCLI/main.swift \
              -parse-as-library -O -framework Foundation \
              -target "${ARCH}-apple-macos13.0" \
              -o "build/${ARCH}/cli/macvigil"
          done

          xcrun lipo -create build/arm64/app/MacVigil build/x86_64/app/MacVigil \
            -output "$MACOS_DIR/MacVigil"
          xcrun lipo -create build/arm64/watchdog/MacVigilWatchdog build/x86_64/watchdog/MacVigilWatchdog \
            -output "$MACOS_DIR/MacVigilWatchdog"
          xcrun lipo -create build/arm64/cli/macvigil build/x86_64/cli/macvigil \
            -output "$HELPERS_DIR/macvigil"

          cp MacVigil/Info.plist "$APP/Contents/Info.plist"

          ICON_PNG="build/MacVigilIcon.png"
          ICONSET="build/MacVigil.iconset"
          xcrun swift MacVigil/Resources/GenerateAppIcon.swift "$ICON_PNG"
          mkdir -p "$ICONSET"
          for SIZE in 16 32 128 256 512; do
            /usr/bin/sips -z "$SIZE" "$SIZE" "$ICON_PNG" --out "$ICONSET/icon_${SIZE}x${SIZE}.png" >/dev/null
            DOUBLE=$((SIZE * 2))
            /usr/bin/sips -z "$DOUBLE" "$DOUBLE" "$ICON_PNG" --out "$ICONSET/icon_${SIZE}x${SIZE}@2x.png" >/dev/null
          done
          /usr/bin/iconutil -c icns "$ICONSET" -o "$RESOURCES_DIR/MacVigil.icns"
          test -s "$RESOURCES_DIR/MacVigil.icns"

          chmod +x "$MACOS_DIR/MacVigil" "$MACOS_DIR/MacVigilWatchdog" "$HELPERS_DIR/macvigil"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

          for BIN in MacVigil MacVigilWatchdog; do
            xcrun lipo -archs "$MACOS_DIR/$BIN" | grep -q arm64
            xcrun lipo -archs "$MACOS_DIR/$BIN" | grep -q x86_64
          done
          xcrun lipo -archs "$HELPERS_DIR/macvigil" | grep -q arm64
          xcrun lipo -archs "$HELPERS_DIR/macvigil" | grep -q x86_64
          "$HELPERS_DIR/macvigil" help | grep -q "control MacVigil from Terminal"
          echo "Universal release app, watchdog, separated macvigil CLI helper, Settings integration, native Liquid Glass availability, statistics, hotkeys, and app icon confirmed."

      - name: Launch smoke test
        shell: bash
        run: |
          set -euo pipefail
          APP_BIN="build/MacVigil.app/Contents/MacOS/MacVigil"
          LOG="build/MacVigil-launch.log"

          "$APP_BIN" >"$LOG" 2>&1 &
          PID=$!
          sleep 6

          if ! kill -0 "$PID" 2>/dev/null; then
            STATUS=0
            wait "$PID" || STATUS=$?
            echo "MacVigil exited during release launch smoke test with status $STATUS" >&2
            cat "$LOG" >&2 || true
            exit 1
          fi

          kill "$PID" 2>/dev/null || true
          wait "$PID" || true
          echo "MacVigil remained alive for 6 seconds after launch."

      - name: Create release assets
        shell: bash
        run: |
          set -euo pipefail
          STAGE="build/dmg"
          mkdir -p "$STAGE"
          cp -R build/MacVigil.app "$STAGE/MacVigil.app"
          cp build/MacVigil.app/Contents/Library/Helpers/macvigil "$STAGE/macvigil"
          chmod +x "$STAGE/macvigil"
          ln -s /Applications "$STAGE/Applications"

          hdiutil create \
            -volname "MacVigil" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "build/MacVigil-${VERSION}.dmg"

          (cd build && shasum -a 256 "MacVigil-${VERSION}.dmg" > SHA256SUMS.txt)
          test -s "build/MacVigil-${VERSION}.dmg"
          test -s build/SHA256SUMS.txt
          echo "Release DMG and checksum confirmed."

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          ARGS=(
            "$TAG"
            "build/MacVigil-${VERSION}.dmg"
            "build/SHA256SUMS.txt"
            --title "MacVigil $TAG"
            --notes-file "$RELEASE_NOTES_FILE"
          )

          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            ARGS+=(--target "${RELEASE_TARGET_SHA:-$GITHUB_SHA}")
          fi

          gh release create "${ARGS[@]}"
          gh release view "$TAG" --json url,isDraft,isPrerelease,assets,body
