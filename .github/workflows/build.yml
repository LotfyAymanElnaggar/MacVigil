name: Build MacVigil

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project metadata
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint MacVigil/Info.plist
          FILE_VERSION="$(tr -d '[:space:]' < RELEASE_VERSION)"
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' MacVigil/Info.plist)
          test -n "$FILE_VERSION"
          test "$FILE_VERSION" = "$PLIST_VERSION"
          echo "Version metadata confirmed: $FILE_VERSION"

      - name: Build universal app and CLI
        shell: bash
        run: |
          set -euo pipefail

          APP="build/MacVigil.app"
          MACOS_DIR="$APP/Contents/MacOS"
          HELPERS_DIR="$APP/Contents/Library/Helpers"
          RESOURCES_DIR="$APP/Contents/Resources"
          mkdir -p "$MACOS_DIR" "$HELPERS_DIR" "$RESOURCES_DIR"
          mkdir -p build/arm64/app build/arm64/watchdog build/arm64/cli
          mkdir -p build/x86_64/app build/x86_64/watchdog build/x86_64/cli

          SRC=(
            MacVigil/App/MacVigilApp.swift
            MacVigil/Models/SessionDuration.swift
            MacVigil/Core/ShellRunner.swift
            MacVigil/Core/Power/PowerAssertions.swift
            MacVigil/Core/Power/SystemPowerVeto.swift
            MacVigil/Core/Power/PowerIntelligenceController.swift
            MacVigil/Core/Lid/RootDomainLidGuard.swift
            MacVigil/Core/Display/BacklightController.swift
            MacVigil/Core/Runtime/VigilManager.swift
            MacVigil/Core/Runtime/PreferenceStore.swift
            MacVigil/Core/Runtime/LiveReconfiguration.swift
            MacVigil/Core/Updates/UpdateManager.swift
            MacVigil/Core/Jobs/JobAwareController.swift
            MacVigil/Core/Hotkeys/GlobalHotkeyManager.swift
            MacVigil/Core/CLI/CLIProtocol.swift
            MacVigil/Core/CLI/CLIControlServer.swift
            MacVigil/Core/CLI/CLIInstallManager.swift
            MacVigil/UI/PolishedMenuBarView.swift
            MacVigil/UI/MacVigilRootView.swift
            MacVigil/UI/PowerIntelligenceView.swift
            MacVigil/UI/PowerIntelligenceBar.swift
            MacVigil/UI/InteractionReliabilityView.swift
            MacVigil/UI/JobGuardWindowView.swift
            MacVigil/UI/LiquidGlassMenuView.swift
            MacVigil/UI/MacVigilSettingsView.swift
            MacVigil/UI/SettingsSceneContainer.swift
            MacVigil/UI/StatisticsView.swift
          )

          COMMON=(
            -parse-as-library
            -O
            -framework SwiftUI
            -framework AppKit
            -framework CoreGraphics
            -framework IOKit
            -framework CryptoKit
            -framework UserNotifications
            -framework ServiceManagement
            -framework Carbon
          )

          for ARCH in arm64 x86_64; do
            xcrun --sdk macosx swiftc "${SRC[@]}" "${COMMON[@]}" \
              -target "${ARCH}-apple-macos13.0" \
              -o "build/${ARCH}/app/MacVigil"

            xcrun --sdk macosx swiftc MacVigilWatchdog/Watchdog.swift \
              -parse-as-library -O \
              -framework CoreGraphics -framework IOKit \
              -target "${ARCH}-apple-macos13.0" \
              -o "build/${ARCH}/watchdog/MacVigilWatchdog"

            xcrun --sdk macosx swiftc \
              MacVigil/Core/CLI/CLIProtocol.swift \
              MacVigilCLI/main.swift \
              -parse-as-library -O -framework Foundation \
              -target "${ARCH}-apple-macos13.0" \
              -o "build/${ARCH}/cli/macvigil"
          done

          xcrun lipo -create build/arm64/app/MacVigil build/x86_64/app/MacVigil \
            -output "$MACOS_DIR/MacVigil"
          xcrun lipo -create build/arm64/watchdog/MacVigilWatchdog build/x86_64/watchdog/MacVigilWatchdog \
            -output "$MACOS_DIR/MacVigilWatchdog"
          xcrun lipo -create build/arm64/cli/macvigil build/x86_64/cli/macvigil \
            -output "$HELPERS_DIR/macvigil"

          cp MacVigil/Info.plist "$APP/Contents/Info.plist"

          ICON_PNG="build/MacVigilIcon.png"
          ICONSET="build/MacVigil.iconset"
          xcrun swift MacVigil/Resources/GenerateAppIcon.swift "$ICON_PNG"
          mkdir -p "$ICONSET"
          for SIZE in 16 32 128 256 512; do
            /usr/bin/sips -z "$SIZE" "$SIZE" "$ICON_PNG" --out "$ICONSET/icon_${SIZE}x${SIZE}.png" >/dev/null
            DOUBLE=$((SIZE * 2))
            /usr/bin/sips -z "$DOUBLE" "$DOUBLE" "$ICON_PNG" --out "$ICONSET/icon_${SIZE}x${SIZE}@2x.png" >/dev/null
          done
          /usr/bin/iconutil -c icns "$ICONSET" -o "$RESOURCES_DIR/MacVigil.icns"
          test -s "$RESOURCES_DIR/MacVigil.icns"

          chmod +x "$MACOS_DIR/MacVigil" "$MACOS_DIR/MacVigilWatchdog" "$HELPERS_DIR/macvigil"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

          for BIN in MacVigil MacVigilWatchdog; do
            file "$MACOS_DIR/$BIN"
            xcrun lipo -archs "$MACOS_DIR/$BIN" | grep -q arm64
            xcrun lipo -archs "$MACOS_DIR/$BIN" | grep -q x86_64
          done
          file "$HELPERS_DIR/macvigil"
          xcrun lipo -archs "$HELPERS_DIR/macvigil" | grep -q arm64
          xcrun lipo -archs "$HELPERS_DIR/macvigil" | grep -q x86_64
          "$HELPERS_DIR/macvigil" help | grep -q "control MacVigil from Terminal"
          echo "Universal app, watchdog, separated macvigil CLI helper, Settings integration, native Liquid Glass availability, hotkeys, statistics, and app icon confirmed."

      - name: Launch smoke test
        shell: bash
        run: |
          set -euo pipefail
          APP_BIN="build/MacVigil.app/Contents/MacOS/MacVigil"
          LOG="build/MacVigil-launch.log"

          "$APP_BIN" >"$LOG" 2>&1 &
          PID=$!
          sleep 6

          if ! kill -0 "$PID" 2>/dev/null; then
            STATUS=0
            wait "$PID" || STATUS=$?
            echo "MacVigil exited during launch smoke test with status $STATUS" >&2
            cat "$LOG" >&2 || true
            exit 1
          fi

          kill "$PID" 2>/dev/null || true
          wait "$PID" || true
          echo "MacVigil remained alive for 6 seconds after launch."

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/MacVigil.app/Contents/Info.plist)
          STAGE="build/dmg"
          mkdir -p "$STAGE"
          cp -R build/MacVigil.app "$STAGE/MacVigil.app"
          cp build/MacVigil.app/Contents/Library/Helpers/macvigil "$STAGE/macvigil"
          chmod +x "$STAGE/macvigil"
          ln -s /Applications "$STAGE/Applications"

          hdiutil create \
            -volname "MacVigil" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "build/MacVigil-${VERSION}.dmg"

          shasum -a 256 "build/MacVigil-${VERSION}.dmg" > build/SHA256SUMS.txt
          test -s "build/MacVigil-${VERSION}.dmg"
          test -s build/SHA256SUMS.txt
          echo "DMG and checksum confirmed."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacVigil-universal
          path: |
            build/MacVigil-*.dmg
            build/SHA256SUMS.txt
            build/MacVigil-launch.log
          if-no-files-found: error
